[project]
name = "library-entities"
version = "0.1.0"
description = "Pure business entities for the university library system"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["library_entities"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py315"

[tool.coverage.run]
source = ["library_entities"]
