[project]
name = "library-entities"
version = "0.1.0"
description = "Pure business entities for the university library system"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["library_entities"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py315"
